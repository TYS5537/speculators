name: Muse CPU tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  muse-training-resume:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_SYSTEM_PYTHON: "1"
      UV_TORCH_BACKEND: cpu
      HF_HUB_OFFLINE: "1"
      HF_DATASETS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Install CPU model test dependencies
        # A fixed baseline for numerical resume checks, not a backend version matrix.
        run: uv pip install ./hs_connectors . "pytest~=9.1.1" "torch==2.12.1" "transformers==4.57.6"
      - name: Run all Muse CPU and training-resume regressions
        run: make test-muse
