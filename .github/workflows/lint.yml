name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install pinned lint dependency
        run: python -m pip install ruff==0.15.20
      - name: Test the gate without model dependencies
        run: python -m unittest discover -s tests/standalone -p test_lint_gate.py -v
      - name: Check lint and formatting
        run: make lint
